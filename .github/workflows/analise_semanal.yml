name: Análise semanal

# Roda domingo à noite (Fase 8 -- ver CASE_DO_PROJETO_1.md seção 7). O job
# "sync" chama sync_atividades.yml como reusable workflow (workflow_call) em
# vez de duplicar os mesmos 4 passos de carga de dado -- isso também resolve
# o problema de a análise pegar dado desatualizado por coincidência de
# horário: ela sincroniza na própria execução, não depende do cron diário já
# ter rodado antes.
# 20h BRT domingo = 23h UTC domingo (dia da semana não muda de UTC-3 pra UTC
# nesse horário, diferente do sync diário).
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: analise-semanal
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/sync_atividades.yml
    secrets: inherit

  analisar:
    needs: sync
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GOOGLE_SHEETS_CREDENTIALS_PATH: .google_sheets_credentials.json
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
      EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
      EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
    steps:
      # Job novo, VM nova -- reusable workflow não compartilha filesystem
      # entre jobs, então o ambiente (checkout, Python, token, credencial)
      # precisa ser preparado de novo aqui. O que foi eliminado é a
      # duplicação dos passos de carga de dado em si (job "sync" acima).
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar token da Garmin
        run: |
          mkdir -p .garmin_tokens
          printf '%s' "$GARMIN_TOKEN" > .garmin_tokens/garmin_tokens.json
        env:
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}

      - name: Restaurar credencial do Google Sheets
        run: printf '%s' "$GOOGLE_SHEETS_CREDENTIALS_JSON" > .google_sheets_credentials.json
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}

      - name: Gerar análise semanal
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: python -m src.analyze.analisar_com_ia
